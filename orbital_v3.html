</style></head><body><main id="game">
<div class="hud"><div class="top"><div><div class="brand">ORBITAL</div><div class="subtitle">HOW FAR CAN YOU GO?</div></div><div class="score">SCORE<br><b id="score">00000</b></div></div><div class="alt"><span id="zone">LAUNCH PAD</span><span id="distance">0 FLIGHT UNITS</span></div><div class="progress" id="progress"></div></div>
<div class="stage"><canvas id="scene" width="360" height="420"></canvas><div id="flight-status" aria-live="polite">ROCKET STANDBY</div></div><section class="panel" id="panel"><div class="intro"><div class="badge">7 QUESTIONS · 1 MISSION</div><h1>READY FOR<br>LAUNCH?</h1><p>Answer seven questions to launch your rocket into space.</p><p style="color:#f2ca68">Play in Safari or Chrome. Sound starts after you tap Start.</p><button class="primary" id="start" onclick="start()">START MISSION 🚀</button></div></section><div class="footer">7 QUESTIONS · ONE LAUNCH · INFINITE POSSIBILITIES</div></main>
<script>
const QUESTIONS=[
{category:"GEOGRAPHY",q:"Name a landlocked African country.",a:[["chad","Chad",8],["mali","Mali",18],["niger","Niger",16],["uganda","Uganda",8],["rwanda","Rwanda",4],["burundi","Burundi",1.5],["botswana","Botswana",4],["zambia","Zambia",3],["zimbabwe","Zimbabwe",5],["malawi","Malawi",2],["lesotho","Lesotho",.3],["eswatini","Eswatini",.3],["swaziland","Eswatini",.3],["ethiopia","Ethiopia",9],["south sudan","South Sudan",1],["central african republic","Central African Republic",.3],["burkina faso","Burkina Faso",2]]},
{category:"ANATOMY",q:"Name a bone in the human body.",a:[["femur","Femur",24],["tibia","Tibia",17],["fibula","Fibula",7],["humerus","Humerus",12],["radius","Radius",8],["ulna","Ulna",6],["clavicle","Clavicle",8],["scapula","Scapula",4],["sternum","Sternum",3],["patella","Patella",7],["mandible","Mandible",4],["skull","Skull",21],["rib","Rib",18],["vertebra","Vertebra",15],["calcaneus","Calcaneus",1],["talus","Talus",.3],["scaphoid","Scaphoid",.3],["pisiform","Pisiform",.2],["phalanx","Phalanx",6],["sacrum","Sacrum",2],["pelvis","Pelvis",18]]},
{category:"HISTORY",q:"Name an ancient civilization or empire.",a:[["roman empire","Roman Empire",25],["rome","Roman Empire",25],["ancient egypt","Ancient Egypt",23],["egyptian","Ancient Egypt",23],["greek","Ancient Greece",19],["ancient greece","Ancient Greece",19],["persian empire","Persian Empire",12],["persia","Persian Empire",12],["maya","Maya",9],["mayan","Maya",9],["inca","Inca",9],["aztec","Aztec",11],["babylon","Babylon",6],["babylonian","Babylon",6],["sumer","Sumer",3],["sumerian","Sumer",3],["assyrian empire","Assyrian Empire",2],["assyria","Assyrian Empire",2],["hittite empire","Hittite Empire",.4],["hittites","Hittite Empire",.4],["akkadian empire","Akkadian Empire",.3],["akkad","Akkadian Empire",.3],["carthage","Carthage",2],["phoenicia","Phoenicia",1],["phoenicians","Phoenicia",1],["maurya empire","Maurya Empire",.3]]},
{category:"SCIENCE",q:"Name a chemical element.",a:[["oxygen","Oxygen",24],["hydrogen","Hydrogen",23],["carbon","Carbon",22],["iron","Iron",18],["gold","Gold",16],["silver","Silver",12],["copper","Copper",10],["helium","Helium",8],["nitrogen","Nitrogen",9],["lithium","Lithium",6],["uranium","Uranium",6],["mercury","Mercury",5],["neon","Neon",4],["sodium","Sodium",7],["potassium","Potassium",5],["calcium","Calcium",8],["silicon","Silicon",3],["tungsten","Tungsten",1],["xenon","Xenon",.4],["krypton","Krypton",.4],["osmium","Osmium",.2],["iridium","Iridium",.3],["rhenium","Rhenium",.2],["astatine","Astatine",.1],["oganesson","Oganesson",.1]]},
{category:"CINEMA",q:"Name a film directed by Christopher Nolan.",a:[["inception","Inception",21],["interstellar","Interstellar",23],["oppenheimer","Oppenheimer",25],["the dark knight","The Dark Knight",20],["batman begins","Batman Begins",8],["the dark knight rises","The Dark Knight Rises",7],["dunkirk","Dunkirk",7],["tenet","Tenet",7],["memento","Memento",5],["the prestige","The Prestige",4],["following","Following",.3],["insomnia","Insomnia",1]]},
{category:"SPORTS",q:"Name a country that has won the men's FIFA World Cup.",a:[["brazil","Brazil",24],["argentina","Argentina",26],["germany","Germany",18],["west germany","Germany",18],["italy","Italy",12],["france","France",11],["uruguay","Uruguay",5],["spain","Spain",3],["england","England",1]]},
{category:"NATURE",q:"Name a planet or dwarf planet in our solar system.",a:[["earth","Earth",27],["mars","Mars",23],["jupiter","Jupiter",19],["saturn","Saturn",17],["venus","Venus",13],["mercury","Mercury",12],["neptune","Neptune",8],["uranus","Uranus",8],["pluto","Pluto",7],["ceres","Ceres",.3],["eris","Eris",.3],["haumea","Haumea",.1],["makemake","Makemake",.1]]}
];
const TIERS=[{name:"COMMON",color:"#a0a0a0",pts:100},{name:"UNCOMMON",color:"#60be7b",pts:300},{name:"GOOD",color:"#65a9ed",pts:600},{name:"RARE",color:"#f05c5c",pts:1000},{name:"ELUSIVE",color:"#b77af4",pts:1500},{name:"ORBITAL",color:"#f2ca68",pts:2500}];
const $=id=>document.getElementById(id),panel=$("panel"),canvas=$("scene"),ctx=canvas.getContext("2d");
let questionDeadline=0,questionClock=null,questionOpen=false,advanceClock=null,boostUntil=0,boostStart=0,boostFrom=0,boostTo=0;let index=0,score=0,altitude=0,target=0,playing=false,results=[],stars=Array.from({length:110},(_,i)=>({x:(i*137+29)%360,y:(i*211+53)%680,s: i%9===0?2:1})),last=0,flame=0;
function normalize(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim().replace(/\s+/g," ")}
function tierFor(p){return p>20?TIERS[0]:p>10?TIERS[1]:p>5?TIERS[2]:p>2?TIERS[3]:p>=.5?TIERS[4]:TIERS[5]}
function zone(){return altitude<300?"EARTH":altitude<1100?"UPPER ATMOSPHERE":altitude<2700?"LOW ORBIT":altitude<4600?"THE MOON":altitude<7000?"MARS":altitude<10000?"JUPITER":altitude<13500?"OUTER SOLAR SYSTEM":"INTERSTELLAR SPACE"}
function update(){ $("score").textContent=String(score).padStart(5,"0");$("zone").textContent=zone();$("distance").textContent=Math.round(altitude).toLocaleString("en-US")+" FLIGHT UNITS";$("progress").innerHTML=Array.from({length:7},(_,i)=>'<div class="pip '+(i<index?'done':'')+'"></div>').join("")}
let audioCtx=null,muted=false,particles=[],cameraShake=0;
function audio(){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,duration=.15,type='sine',volume=.07,delay=0){if(muted||!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(volume,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration+.02)}
function sfx(kind){audio();if(kind==='launch'){[90,110,140,180,230,300].forEach((f,i)=>tone(f,.25,'sawtooth',.035,i*.07))}else if(kind==='orbital'){[440,554,659,880,1108].forEach((f,i)=>tone(f,.45,'triangle',.08,i*.11))}else if(kind==='correct'){[392,523,659].forEach((f,i)=>tone(f,.16,'square',.035,i*.08))}else tone(170,.24,'sawtooth',.04)}
function burst(color,count=35){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,sp=1+Math.random()*5;particles.push({x:180,y:160,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*35,color,size:2+Math.random()*4})}}
function intro(){panel.innerHTML='<div class="intro"><div class="badge">7-QUESTION SPACE TRIVIA</div><h1>READY FOR<br>LAUNCH?</h1><p>Give uncommon correct answers to launch your rocket farther into space.</p><p>COMMON · UNCOMMON · GOOD<br>RARE · ELUSIVE · <b style="color:#f2ca68">ORBITAL</b></p><button class="primary" id="start">START MISSION 🚀</button><button class="secondary" id="sound" style="margin-top:14px">SOUND: ON ♪</button><p style="font-size:9px">DEMO: rarity estimates, not live player statistics.</p></div>';$('start').onclick=start;$('sound').onclick=()=>{muted=!muted;$('sound').textContent='SOUND: '+(muted?'OFF':'ON ♪');if(!muted){audio();tone(660)}}}
function start(){stopQuestionClock();clearTimeout(advanceClock);audio();index=0;score=0;altitude=0;target=0;results=[];playing=true;update();sfx('launch');burst('#f4c86c',28);panel.innerHTML='<div class="intro"><div class="kicker">MISSION START</div><h1 id="countdown">3</h1><p>IGNITION SEQUENCE</p></div>';let n=3;let timer=setInterval(()=>{n--;if(n>0){$('countdown').textContent=n;tone(550,.1)}else{clearInterval(timer);$('countdown').textContent='LIFTOFF!';tone(900,.4);setTimeout(ask,650)}},500)}
function stopQuestionClock(){if(questionClock!==null){clearInterval(questionClock);questionClock=null}questionOpen=false}
function clockTick(){if(!questionOpen)return;let remaining=Math.max(0,(questionDeadline-performance.now())/1000);let el=$('seconds'),bar=$('timer-fill');if(el)el.textContent=remaining.toFixed(1)+'s';if(bar){bar.style.width=(remaining/30*100)+'%';bar.style.background=remaining<=7?'#f05c5c':'#e9c56d'}if(remaining<=0){stopQuestionClock();reveal('TIME UP','#f05c5c',0,'30 seconds elapsed. No points awarded.','No answer',true)}}
function editDistance(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row}return prev[b.length]}
function suggestionFor(raw){let n=normalize(raw);if(n.length<3)return null;let q=QUESTIONS[index];let options=new Map();for(let item of q.a){let canonical=normalize(item[1]),alias=normalize(item[0]);for(let word of [canonical,alias]){let d=editDistance(n,word);let max=word.length>=9?2:1;if(d>0&&d<=max){let old=options.get(canonical);if(!old||d<old.d)options.set(canonical,{d,name:item[1]})}}}return [...options.values()].sort((a,b)=>a.d-b.d||a.name.length-b.name.length)[0]||null}
function showSuggestion(){let box=$('suggestion'),input=$('answer');if(!box||!input)return;let candidate=suggestionFor(input.value);if(!candidate){box.hidden=true;return}box.hidden=false;box.textContent='Did you mean '+candidate.name+'?';box.onclick=()=>{input.value=candidate.name;box.hidden=true;input.focus()}}
function ask(){if(index===7){finish();return}clearTimeout(advanceClock);stopQuestionClock();let q=QUESTIONS[index];panel.innerHTML='<div class="kicker">QUESTION '+(index+1)+'/7 · '+q.category+'</div><div class="timer-wrap"><span class="timer-value" id="seconds">30.0s</span><div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div></div><div class="question">'+q.q+'</div><div class="hint">30 seconds. Give a valid answer — the rarer, the better.</div><form id="form"><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer..." maxlength="65" required><button type="button" id="suggestion" class="suggestion" hidden></button><button class="primary">SUBMIT ANSWER →</button></form>';$('form').onsubmit=e=>{e.preventDefault();submit()};$('answer').addEventListener('input',()=>{showSuggestion();let err=$('error');if(err)err.remove()});questionOpen=true;questionDeadline=performance.now()+30000;questionClock=setInterval(clockTick,100);clockTick()}
function submit(){if(!questionOpen)return;if(performance.now()>=questionDeadline){clockTick();return}let q=QUESTIONS[index],raw=$('answer').value.trim(),norm=normalize(raw),item=q.a.find(x=>normalize(x[0])===norm||normalize(x[1])===norm);if(!item){let suggestion=suggestionFor(raw);if(suggestion){showSuggestion();invalid('Check the spelling suggestion below the answer field.')}else invalid('Answer not recognized in this demo. Try another valid answer.');sfx('error');return}stopQuestionClock();let tier=tierFor(item[2]);reveal(tier.name,tier.color,tier.pts,'Estimated response frequency: '+item[2]+'% · '+item[1],item[1],false)}
function invalid(t){let x=$('error');if(!x){x=document.createElement('div');x.id='error';x.className='details';$('form').append(x)}x.textContent=t}
function reveal(name,color,points,desc,answer,timedOut=false){stopQuestionClock();score+=points;boostFrom=altitude;boostTo=target+points;target=boostTo;boostStart=performance.now();boostUntil=boostStart+(points?2400:900);flame=points?155:0;cameraShake=points>=1000?12:points?5:0;if(points)burst(color,points===2500?100:45);sfx(points===2500?'orbital':points?'launch':'error');results.push({name,color,points,answer});index++;update();$('flight-status').textContent=points?'BOOST +'+points.toLocaleString('en-US'):'NO BOOST · +0';panel.innerHTML='<div class="kicker">ANSWER '+index+'/7</div><div class="tier" style="color:'+color+'">'+name+'</div><div class="message">'+desc+'</div><div class="details">+'+points.toLocaleString('en-US')+' POINTS · '+(points?'ROCKET ASCENDING':'NO ALTITUDE GAIN')+'</div><button class="primary" id="next" disabled>FLIGHT IN PROGRESS...</button>';advanceClock=setTimeout(()=>{let b=$('next');if(b){b.disabled=false;b.textContent=index===7?'VIEW MISSION RESULTS →':'NEXT QUESTION →';b.onclick=ask}if(index<7){$('flight-status').textContent='HOVERING · AWAITING NEXT ANSWER'}},points?2450:950)}
function finish(){stopQuestionClock();playing=false;sfx('orbital');let label=score>=14500?'INTERSTELLAR LEGEND':score>=10000?'DEEP SPACE EXPLORER':score>=6000?'SOLAR SYSTEM TRAVELER':score>=2500?'ORBITAL PILOT':'EARTH EXPLORER';panel.innerHTML='<div class="kicker">MISSION COMPLETE · 7/7</div><div class="question">'+label+'</div><div class="finalscore">'+score.toLocaleString('en-US')+'</div><div class="details">FINAL POSITION: '+zone()+'<br>7 QUESTIONS COMPLETED</div><div class="results">'+results.map((r,i)=>'<div>'+(i+1)+'. '+r.answer+' <b style="color:'+r.color+'">'+r.name+'</b> +'+r.points+'</div>').join('')+'</div><button class="primary" id="again">PLAY AGAIN ↻</button><button class="secondary" id="share" style="width:100%;margin-top:12px">COPY RESULTS</button>';$('again').onclick=start;$('share').onclick=()=>{let s='🚀 ORBITAL — '+score+' pts\n'+results.map((r,i)=>(i+1)+'. '+r.name+' +'+r.points).join('\n');navigator.clipboard?.writeText(s).then(()=>{$('share').textContent='COPIED!'}).catch(()=>{$('share').textContent='COPY UNAVAILABLE'})}}
function draw(t){let dt=Math.min((t-last)/16.7||1,3);last=t;let now=performance.now();if(now<boostUntil){let p=Math.min(1,(now-boostStart)/(boostUntil-boostStart));let ease=1-Math.pow(1-p,3);altitude=boostFrom+(boostTo-boostFrom)*ease}else altitude=target;let w=360,h=420;let k=Math.min(1,altitude/5000);let gradient=ctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,k>.4?"#06091a":"#163b6a");gradient.addColorStop(1,k>.4?"#11122e":"#72a9d1");ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);
ctx.save();ctx.globalAlpha=Math.min(1,.15+k*1.8);for(let s of stars){pixelRect(s.x,(s.y+(altitude*.22))%420,s.s,s.s,"#d8e4ff")}ctx.restore();
if(altitude<1600){let groundY=335+altitude*.45;pixelRect(0,groundY,360,250,"#304d46");for(let i=0;i<18;i++)pixelRect(i*23,groundY+(i%4)*4,13,6,"#477362");pixelRect(142,groundY-8,78,8,"#707e91");pixelRect(155,groundY-15,53,7,"#a4aeb7");for(let i=0;i<7;i++){let x=(i*79+33)%360,y=100+(i*97)%280+altitude*.28;pixelRect(x,y,42,11,"#c0d9e8");pixelRect(x+8,y-7,26,8,"#e2edf5")}}
if(altitude>850){let r=altitude<3300?140:Math.max(0,140-(altitude-3300)*.035);if(r>5){ctx.fillStyle="#234e9a";ctx.beginPath();ctx.arc(185,445,r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#4f9e83";ctx.fillRect(170,380,60,20)}}
if(altitude>2900){let planets=[{at:3400,x:265,y:165,r:24,c:"#bbb9ad"},{at:6000,x:70,y:165,r:35,c:"#b65d49"},{at:8900,x:290,y:130,r:53,c:"#ba936f"},{at:12200,x:55,y:110,r:46,c:"#6b9dc8"}];let p=planets.reduce((a,b)=>Math.abs(b.at-altitude)<Math.abs(a.at-altitude)?b:a);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.fillStyle="#ffffff24";ctx.fillRect(p.x-p.r/2,p.y-4,p.r,5)}
// Parallax speed lines during boosts
if(flame>0){for(let i=0;i<16;i++){let xx=(i*71+19)%360,yy=(i*83+t*(.25+i%4*.14))%420;pixelRect(xx,yy,1,10+i%5*7,'#ffffff55')}}
let x=180,y=160+Math.sin(t/330)*3;
ctx.save();if(cameraShake>0){ctx.translate((Math.random()-.5)*cameraShake,(Math.random()-.5)*cameraShake);cameraShake*=.9;if(cameraShake<.3)cameraShake=0}
pixelRect(x-7,y-35,14,9,"#f0f1eb");pixelRect(x-11,y-26,22,36,"#d8e2eb");pixelRect(x-7,y-27,14,35,"#f6f3e8");pixelRect(x-5,y-18,10,10,"#32679c");pixelRect(x-3,y-16,6,6,"#8fd8ef");pixelRect(x-17,y+1,7,22,"#d65b54");pixelRect(x+10,y+1,7,22,"#d65b54");pixelRect(x-8,y+9,16,12,"#a1aab9");pixelRect(x-5,y+21,10,4,"#515d75");if(flame>0){flame-=dt;pixelRect(x-7,y+25,14,Math.round(14+Math.random()*15),"#f2bd53");pixelRect(x-3,y+25,6,Math.round(18+Math.random()*19),"#fff1a3")}else{pixelRect(x-3,y+25,6,7,"#d68a55")}ctx.restore();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=dt;p.vy+=.018;ctx.globalAlpha=Math.min(1,p.life/25);pixelRect(p.x,p.y,p.size,p.size,p.color);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}requestAnimationFrame(draw)}
intro();update();requestAnimationFrame(draw);
</script></body></html>
